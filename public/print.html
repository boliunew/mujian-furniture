<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打印 · 木间后台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--ink:#111;--muted:#555;--line:#bbb;--bg:#e9ebe7;--paper:#fff;--accent:#2f5a4c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121816;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);font-family:"Work Sans",system-ui,sans-serif;color:var(--ink)}
.bar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px));background:#1d2a26;color:#fff;font-size:14px}
.bar button,.bar a{background:#fff;color:#1d2a26;border:0;border-radius:6px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.bar .note{opacity:.85;font-size:13px;flex:1;min-width:220px}
.pages{display:grid;gap:24px;justify-content:center;padding:24px 16px 60px}
.page{background:var(--paper);color:var(--ink);box-shadow:0 2px 12px rgba(0,0,0,.18);overflow:hidden}

/* 4×6 in shipping label */
.label{width:4in;height:6in;padding:.16in;display:flex;flex-direction:column;gap:.1in;font-size:10pt}
.label .from{font-size:8pt;line-height:1.3;border-bottom:1.5px solid #000;padding-bottom:.08in}
.label .from b{font-size:9pt}
.label .to-h{font-size:8pt;font-weight:700;letter-spacing:.12em}
.label .to{font-size:15pt;line-height:1.25;font-weight:700;text-transform:uppercase}
.label .flag{border:3px solid #000;text-align:center;font-weight:700;font-size:15pt;letter-spacing:.06em;padding:.04in}
.label .bc{margin-top:auto;text-align:center}
.label .bc svg{width:100%;height:auto;max-height:1in}
.label .meta{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:8.5pt;border-top:1.5px solid #000;padding-top:.06in}

/* Letter packing slip */
.slip{width:8.5in;min-height:11in;padding:.6in;font-size:11pt;display:flex;flex-direction:column;gap:.25in}
.slip header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:.15in}
.slip h1{margin:0;font-size:22pt;color:var(--accent)}
.slip .no{font-family:"JetBrains Mono",monospace;font-size:14pt;text-align:right}
.slip .cols{display:grid;grid-template-columns:1fr 1fr;gap:.3in}
.slip h2{font-size:9pt;letter-spacing:.12em;color:var(--muted);margin:0 0 4px}
.slip table{width:100%;border-collapse:collapse}
.slip th,.slip td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.slip th{font-size:9pt;color:var(--muted);letter-spacing:.06em}
.slip td.q,.slip th.q{text-align:center;width:.7in}
.slip td.box{width:.5in}
.slip td.box span{display:inline-block;width:14px;height:14px;border:1.5px solid var(--ink)}
.slip .notes{border:1px dashed var(--line);padding:10px;min-height:.8in;font-size:10pt}
.slip footer{margin-top:auto;font-size:9.5pt;color:var(--muted);border-top:1px solid var(--line);padding-top:.12in}
.empty{color:#fff;text-align:center;padding:60px}
.bol{font-size:10pt;gap:.14in}
.bx{border:1.5px solid var(--ink);padding:8px 10px}
.bol table{border:1.5px solid var(--ink)}
.bol th,.bol td{border:1px solid var(--line);font-size:9.5pt;vertical-align:top}
.sig3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:8.5pt;margin-top:auto}
.sig3>div{border:1.5px solid var(--ink);padding:8px}
.sku{width:2.25in;height:1.25in;padding:.06in .09in;display:flex;flex-direction:column;justify-content:space-between;font-size:8pt}
.sku .sn1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sku svg{width:100%;height:auto;max-height:.72in}
.sku .sn2{display:flex;justify-content:space-between;font-size:7pt;color:var(--muted)}
@media screen{.pages:has(.sku){grid-template-columns:repeat(auto-fill,2.25in)}}
.count{font-size:10pt}
.wbox{display:inline-block;min-width:.6in;height:.28in;border:1.5px solid var(--ink);line-height:.28in;font-family:"JetBrains Mono",monospace}
.manifest .stop{display:grid;grid-template-columns:.45in 1fr 1.7in;gap:12px;border-bottom:1px solid var(--line);padding:10px 0;break-inside:avoid;font-size:10.5pt}
.manifest .sn{font:700 20pt "JetBrains Mono",monospace;text-align:center;border:2px solid var(--ink);border-radius:50%;width:.42in;height:.42in;line-height:.38in;font-size:13pt}
.manifest .meta2{font-size:9.5pt;color:var(--muted)}
.manifest .sig{font-size:8.5pt;border:1px dashed var(--line);padding:6px}

@media print{
  body{background:#fff}
  .bar{display:none}
  .pages{display:block;padding:0}
  .page{box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
}
@media screen and (max-width:8.8in){.slip{width:100%;min-height:0;padding:24px}.slip .cols{grid-template-columns:1fr}}
@media screen and (max-width:4.3in){.label{width:100%;height:auto;aspect-ratio:2/3}}
</style>
<style id="pageSize"></style>
</head>
<body>
<div class="bar">
  <a id="back" href="admin.html">← 返回后台</a>
  <button id="printBtn">🖨️ 打印</button>
  <span class="note" id="note"></span>
</div>
<div class="pages" id="pages"><div class="empty">⏳ 正在生成…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="api.js"></script>
<script>
let qs = location.search;
try { if (!qs) qs = sessionStorage.getItem("mj-print") || ""; else sessionStorage.setItem("mj-print", qs); } catch (e) {}
const q = new URLSearchParams(qs);
const type = ["slip", "label", "bol", "manifest", "sku", "count"].includes(q.get("type")) ? q.get("type") : "label";
const ids = (q.get("ids") || "").split(",").filter(Boolean);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = c => (c / 100).toLocaleString("en-US", { style: "currency", currency: "USD" });

document.getElementById("pageSize").textContent = type === "label" ? "@page{size:4in 6in;margin:0}"
  : type === "sku" ? "@page{size:2.25in 1.25in;margin:0}" : "@page{size:letter;margin:0}";
document.getElementById("note").textContent = {
  label: "🏷️ 4×6 英寸地址标签，适合 Rollo / Zebra 热敏打印机。打印对话框里选标签打印机、纸张 4×6、缩放 100%。⚠️ 不含邮资，邮资需另外购买。",
  slip: "🧾 Letter 装箱单，放进箱子里给顾客。普通打印机即可。",
  bol: "📄 BOL 提单（Letter），一式三份：自己留一份，司机提货时签字带走两份。NMFC 编号栏留空，按承运商要求填写。",
  manifest: "🗒️ 司机单（Letter），按时段和站序排好，顾客签收后带回。",
  sku: "🏷️ 商品条码标签 2.25×1.25 英寸，Rollo / Zebra / DYMO 都有这个尺寸。贴在包装箱和货架上，盘点时扫这个码。",
  count: "📋 盘点表（Letter），按库位排好。拿着纸盘的话，回来把数字填进后台；用手机盘可以直接扫码。",
}[type];
if (api.mode !== "live") {
  document.getElementById("note").textContent += " 👀 预览版里浏览器不允许弹出打印窗口，部署后点「打印」会直接打开打印对话框。";
}
document.getElementById("printBtn").onclick = () => window.print();
document.getElementById("back").onclick = e => { if (api.mode === "live" && window.opener) { e.preventDefault(); window.close(); } };

function drawBarcodes() {
  document.querySelectorAll(".barcode").forEach(svg => {
    const h = +svg.dataset.h || 60;
    if (window.JsBarcode) JsBarcode(svg, svg.dataset.code, { format: "CODE128", height: h, width: h < 50 ? 1.4 : 2, fontSize: h < 50 ? 11 : 14, margin: 0, displayValue: true });
    else svg.outerHTML = `<div style="font:700 ${h < 50 ? 12 : 20}pt 'JetBrains Mono',monospace;letter-spacing:.06em">${esc(svg.dataset.code)}</div>`;
  });
}
function autoPrint() { if (api.mode === "live" && q.get("auto") !== "0") setTimeout(() => window.print(), 400); }

function addrLines(o) {
  return [o.ship_name, o.ship_line1, o.ship_line2, `${o.ship_city || ""}, ${o.ship_state || ""} ${o.ship_zip || ""}`.trim()]
    .filter(x => x && x !== ",");
}

function label(o, store) {
  const pieces = o.items.reduce((n, i) => n + i.qty, 0);
  const white = /White/.test(o.ship_method || "");
  return `<section class="page label">
    <div class="from"><b>${esc(store.name)}</b><br>${store.address.map(esc).join("<br>")}</div>
    <div class="to-h">SHIP TO</div>
    <div class="to">${addrLines(o).map(esc).join("<br>")}</div>
    ${o.phone ? `<div>☎ ${esc(o.phone)}</div>` : ""}
    ${white ? `<div class="flag">WHITE GLOVE · ASSEMBLY</div>` : ""}
    <div class="bc"><svg class="barcode" data-code="${esc(o.order_no)}"></svg></div>
    <div class="meta"><span>${esc(o.order_no)}</span><span>${pieces} PC${pieces > 1 ? "S" : ""}</span><span>${new Date(o.paid_at || o.created_at).toLocaleDateString("en-US")}</span></div>
  </section>`;
}

const yes = b => b ? "☑" : "☐";
function bol(o, store) {
  const pieces = o.items.filter(i => i.ship_mode !== "parcel").reduce((n, i) => n + i.qty, 0);
  const inside = o.service === "threshold" || o.service === "white_glove";
  const resid = o.home_type !== "business";
  const day = new Date((o.pickup_date || new Date().toISOString().slice(0, 10)) + "T12:00:00").toLocaleDateString("en-US");
  return `<section class="page slip bol">
    <header><div><h1 style="font-size:16pt;color:var(--ink)">STRAIGHT BILL OF LADING</h1><div>Short form · Not negotiable</div></div>
      <div class="no">BOL # <b>${esc(o.order_no)}</b><br><span style="font-size:10pt">Date ${day}</span><br><span style="font-size:10pt">PRO # ${esc(o.pro || "________________")}</span></div></header>
    <div class="cols">
      <div class="bx"><h2>SHIP FROM</h2><b>${esc(store.name)}</b><br>${store.address.map(esc).join("<br>")}<br>☎ ${esc(store.phone || "")}</div>
      <div class="bx"><h2>SHIP TO</h2>${addrLines(o).map(esc).join("<br>")}<br>☎ ${esc(o.phone || "")}<br>${resid ? "Residential" : "Business"}${o.floor > 1 ? ` · Floor ${o.floor}${o.elevator ? " (elevator)" : " (no elevator)"}` : ""}</div>
    </div>
    <div class="cols">
      <div class="bx"><h2>CARRIER</h2>${esc(o.freight_carrier || "________________")}<br>Pickup ${day}</div>
      <div class="bx"><h2>FREIGHT CHARGES</h2>☑ Prepaid &nbsp; ☐ Collect &nbsp; ☐ 3rd party<br>Bill to: ${esc(store.name)}</div>
    </div>
    <table>
      <thead><tr><th>HANDLING UNITS</th><th>PIECES</th><th>HM</th><th>DESCRIPTION</th><th>NMFC #</th><th>CLASS</th><th>WEIGHT (LB)</th></tr></thead>
      <tbody><tr><td>${o.pallets || 1} PLT</td><td>${pieces}</td><td></td>
        <td>Furniture, wood, boxed on pallets<br><span style="font-size:9pt;color:var(--muted)">${o.items.filter(i => i.ship_mode !== "parcel").map(i => esc(i.name) + " ×" + i.qty).join("; ")}</span></td>
        <td></td><td>${esc(o.freight_class || "")}</td><td>${o.weight_lb || ""}</td></tr></tbody>
    </table>
    <div class="bx"><h2>ACCESSORIALS</h2>
      ${yes(o.liftgate)} Liftgate at delivery &nbsp; ${yes(resid)} Residential delivery &nbsp; ☑ Appointment / call before delivery &nbsp; ${yes(inside)} Inside delivery</div>
    <div class="bx"><h2>SPECIAL INSTRUCTIONS</h2>
      ${o.appt_date ? `Customer requested ${new Date(o.appt_date + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })}, ${esc(o.appt_window_label)}. ` : ""}Call consignee at ${esc(o.phone || "")} to confirm the window.
      ${o.access_notes ? `<br>${esc(o.access_notes)}` : ""}</div>
    <div class="sig3">
      <div>SHIPPER SIGNATURE / DATE<br><br>______________________</div>
      <div>CARRIER SIGNATURE / PICKUP DATE<br><br>______________________</div>
      <div>RECEIVED IN GOOD ORDER (CONSIGNEE)<br><br>______________________</div>
    </div>
  </section>`;
}

function manifest(orders, store, date, truck, windows) {
  const rank = Object.fromEntries((windows || []).map((w, i) => [w.id, i]));
  orders.sort((a, b) => (rank[a.appt_window] ?? 9) - (rank[b.appt_window] ?? 9) || (a.stop_no || 99) - (b.stop_no || 99));
  const d = date ? new Date(date + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }) : "";
  const HOME = { house: "House", apartment: "Apartment", business: "Business" };
  const SVC = { curbside: "Curbside", threshold: "Inside first door", white_glove: "White glove + assembly" };
  return `<section class="page slip manifest">
    <header><div><h1>Driver Manifest</h1><div>${esc(store.name)} · ${store.address.map(esc).join(", ")}</div></div>
      <div class="no">${esc(truck || "Unassigned")}<br><b>${esc(d)}</b><br><span style="font-size:10pt">${orders.length} stop${orders.length === 1 ? "" : "s"}</span></div></header>
    ${orders.map((o, i) => `<div class="stop">
      <div class="sn">${o.stop_no || i + 1}</div>
      <div><b>${esc(o.ship_name)}</b> · ☎ ${esc(o.phone || "")}<br>${addrLines(o).slice(1).map(esc).join(", ")}
        <div class="meta2">🕘 ${esc(o.appt_window_label || "")} · ${SVC[o.service] || ""} · ${HOME[o.home_type] || "—"}${o.floor > 1 ? `, floor ${o.floor}${o.elevator ? " (elevator)" : " (stairs)"}` : ""}${o.liftgate ? " · liftgate" : ""}</div>
        <div>${o.items.filter(i => i.ship_mode !== "parcel").map(i => `☐ ${esc(i.name)} ×${i.qty}`).join("<br>")}</div>
        ${o.access_notes ? `<div class="meta2">📝 ${esc(o.access_notes)}</div>` : ""}
        <div class="meta2">${esc(o.order_no)}</div></div>
      <div class="sig">Received in good condition<br><br>Signature ____________<br>Time ______</div>
    </div>`).join("")}
  </section>`;
}

function skuLabel(p, bin) {
  return `<section class="page sku">
    <div class="sn1">${esc(p.name)}</div>
    <svg class="barcode" data-code="${esc(p.sku)}" data-h="38"></svg>
    <div class="sn2"><span>${bin ? "📍 " + esc(bin) : ""}</span><span>${esc(p.cat || "")}</span></div>
  </section>`;
}

function countSheet(c, store) {
  const blind = c.blind && c.status === "open";
  return `<section class="page slip count">
    <header><div><h1>Stock Count · 盘点表</h1><div>${esc(store.name)} · ${esc(c.warehouse_name)}</div></div>
      <div class="no">${esc(c.no)}<br><span style="font-size:10pt">${new Date(c.created_at).toLocaleString("zh-CN")}</span><br>
      <span style="font-size:10pt">${c.total} 项${blind ? " · 盲盘" : ""}</span></div></header>
    <table><thead><tr><th>库位</th><th>商品</th><th>SKU</th>${blind ? "" : "<th class=\"q\">账面</th>"}<th class="q">实盘</th><th>备注</th></tr></thead>
      <tbody>${c.lines.map(l => `<tr><td>${esc(l.bin || "—")}</td><td>${esc(l.name)}</td><td style="font-family:'JetBrains Mono',monospace;font-size:9pt">${esc(l.sku || "")}</td>
        ${blind ? "" : `<td class="q">${l.expected}</td>`}<td class="q"><span class="wbox">${l.counted ?? ""}</span></td><td></td></tr>`).join("")}</tbody></table>
    <div class="sig3"><div>盘点人 / Counted by<br><br>______________________</div><div>复核人 / Checked by<br><br>______________________</div><div>日期 / Date<br><br>______________________</div></div>
  </section>`;
}

function slip(o, store) {
  return `<section class="page slip">
    <header>
      <div><h1>${esc(store.name)}</h1><div>${store.address.map(esc).join(" · ")}</div><div>${esc(store.email)}</div></div>
      <div class="no">PACKING SLIP<br><b>${esc(o.order_no)}</b><br><span style="font-size:10pt">${new Date(o.paid_at || o.created_at).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })}</span></div>
    </header>
    <div class="cols">
      <div><h2>SHIP TO</h2>${addrLines(o).map(esc).join("<br>")}</div>
      <div><h2>DELIVERY</h2>${esc(o.ship_method || "Standard delivery")}<br>${o.email ? esc(o.email) + "<br>" : ""}${esc(o.phone || "")}</div>
    </div>
    <table>
      <thead><tr><th></th><th>ITEM</th><th class="q">QTY</th></tr></thead>
      <tbody>${o.items.map(i => `<tr><td class="box"><span></span></td><td>${esc(i.name)}</td><td class="q">${i.qty}</td></tr>`).join("")}</tbody>
    </table>
    <div><h2>NOTES</h2><div class="notes"></div></div>
    <footer>Thank you for your order. Questions or damage on arrival? Email ${esc(store.email)} within 7 days and include ${esc(o.order_no)}.</footer>
  </section>`;
}

(async () => {
  const box = document.getElementById("pages");
  if (!ids.length) { box.innerHTML = `<div class="empty">没有选中的订单</div>`; return; }
  try {
    if (type === "sku") {
      const inv = await api.inventory(), copies = Math.max(1, Math.min(50, +q.get("copies") || 1));
      const main = inv.warehouses[0] && inv.warehouses[0].id;
      box.innerHTML = inv.products.filter(p => ids.includes(p.id))
        .flatMap(p => Array(copies).fill(skuLabel(p, main && p.cells[main] && p.cells[main].bin))).join("");
      drawBarcodes(); return autoPrint();
    }
    if (type === "count") {
      const [store, c] = await Promise.all([api.store(), api.getCount(ids[0])]);
      box.innerHTML = countSheet(c, store); return autoPrint();
    }
    const [store, ...orders] = await Promise.all([api.store(), ...ids.map(id => api.getOrder(id))]);
    const settings = type === "manifest" ? await api.settings().catch(() => null) : null;
    box.innerHTML = type === "manifest" ? manifest(orders, store, q.get("date"), q.get("truck"), settings && settings.windows)
      : orders.map(o => ({ label, slip, bol })[type](o, store)).join("");
    drawBarcodes(); autoPrint();
  } catch (e) {
    box.innerHTML = `<div class="empty">⚠️ ${esc(e.message)}${e.status === 401 ? '<br><a href="admin.html" style="color:#fff">先登录后台</a>' : ""}</div>`;
  }
})();
</script>
</body>
</html>
