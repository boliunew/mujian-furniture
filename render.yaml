# One-click deploy on Render: New → Blueprint → pick this repo.
# The disk keeps the database and uploaded photos across deploys (needs a paid instance).
services:
  - type: web
    name: mujian-furniture
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py server:app
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DB_PATH
        value: /var/data/shop.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: STORE_TZ
        value: America/Los_Angeles
      - key: DOMAIN              # https://your-store.onrender.com or your own domain
        sync: false
      - key: ADMIN_PASSWORD      # at least 10 characters
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
